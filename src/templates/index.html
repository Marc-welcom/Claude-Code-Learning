{% extends "base.html" %}

{% block title %}Courses{% endblock %}

{% block content %}
<h2>Available Courses</h2>
<ul>
    {% for course in courses %}
    <li>
        <a href="{{ url_for('course_detail', course_id=course.id) }}">{{ course.title }}</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
